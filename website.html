<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Sample</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            text-align: center;
            font-family: sans-serif;
            background-color: #fafafa;
        }

        div{
            border: 1px solid black;
        }

        /* ヘッダー */
        .header{
            background-color: #333;
            color: white;
            padding: 20px;
            font-size: 30px;
        }

        /* メイン部分 */
        .main{
            width: 90%;
            margin: 30px auto;

            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .content{
            width: 250px;
            background-color: #f0f0f0;
            padding: 10px;
        }

        .title{
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle{
            font-size: 20px;
            margin-bottom: 10px;
        }

        .text{
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* 画像 */
        .content img{
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <div class="header">
        ロクデナシ
    </div>

    <!-- コンテンツ -->
    <div class="main">

        <!-- content1 -->
        <div class="content">
            <div class="title">ただ声一つ</div>
            <div class="subtitle">Key = E♭ major</div>
            <div class="text">MIMI</div>

            
        </div>

        <!-- content2 -->
        <div class="content">
            <div class="title">スピカ</div>
            <div class="subtitle">Key = G</div>
            <div class="text">ナユタン星人</div>

           
        </div>

        <!-- content3 -->
        <div class="content">
            <div class="title">アルビレオ</div>
            <div class="subtitle">Key = G</div>
            <div class="text">ナユタン星人</div>

            
        </div>
