<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Sample</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            text-align: center;
            font-family: sans-serif;
            background-color: #fafafa;
        }

        div{
            border: 1px solid black;
        }

        .header{
            background-color: #1E90FF;
            color: white;
            padding: 20px;
            font-size: 30px;
        }

        .main{
            width: 90%;
            margin: 30px auto;

            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .content{
            width: 250px;
            background-color: #ffffff;
            padding: 10px;

            transition: transform 0.3s ease;
        }

        .content:hover{
            transform: translateY(-15px) scale(1.05);
        }

        .title{
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle{
            font-size: 20px;
            margin-bottom: 10px;
        }

        .text{
            font-size: 16px;
            margin-bottom: 15px;
        }

        .content img{
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="header">
        ロクデナシ
    </div>

    <div class="main">
       
        <div class="content">
            <div class="title">ただ声一つ</div>
            <div class="subtitle">Key = E♭ major</div>
            <div class="text">MIMI</div>
        </div>

        <div class="content">
            <div class="title">スピカ</div>
            <div class="subtitle">Key = G</div>
            <div class="text">ナユタン星人</div>
        </div>

        <div class="content">
            <div class="title">アルビレオ</div>
            <div class="subtitle">Key = G</div>
            <div class="text">ナユタン星人</div>
        </div>

    </div>

</body>
</html>
